name: IIR application tests
on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/iir-tests.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
